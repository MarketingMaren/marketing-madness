<style>
/* Layout: one narrow phone column, sticky timer bar on top, a single card per step; overlays for retention offers. Deliberately single-theme (evergreen + gold "premium" look). */
:root{

  --f-display:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;
  background:radial-gradient(120% 60% at 50% 0%, var(--bg2), var(--bg) 70%) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

h1{font-size:1.65rem;font-weight:800}

p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}

.field{display:flex;flex-direction:column;gap:6px}

  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{max-width:400px;width:100%;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:center}

.captcha button.ph{position:relative;overflow:hidden;background:var(--bg)}
.captcha button.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .15s}
.captcha button.ph[aria-pressed=true] img{transform:scale(.86);border-radius:6px}
.captcha button.ph[aria-pressed=true]::after{content:"✓";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-size:.8rem;font-weight:800;display:grid;place-items:center}
.queue-num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:3.4rem;font-weight:700;color:var(--gold);text-align:center;line-height:1}
.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--gold);width:0;transition:width .3s}
canvas.sig{width:100%;height:160px;background:#f2efe4;border-radius:10px;touch-action:none;display:block}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.board li.me{color:var(--gold);font-weight:700}
.board .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.board .r{font-family:var(--f-mono);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.stamp{font-family:var(--f-display);font-weight:800;color:var(--ok);border:3px solid var(--ok);border-radius:10px;padding:8px 12px;transform:rotate(-4deg);align-self:center;text-transform:uppercase;letter-spacing:.06em}
.mission{background:var(--bg);border:2px solid var(--gold);border-radius:14px;padding:18px 18px;display:flex;flex-direction:column;gap:10px}
.mission .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mission ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.mission ol li::marker{color:var(--gold);font-weight:700}
.mission-strip{display:flex;gap:10px;align-items:center;background:#3a1d22;border:1px solid var(--red);border-radius:12px;padding:10px 14px;font-weight:700;font-size:.9rem}
.intro{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.intro::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;min-height:min(540px,calc(100dvh - 190px));display:flex;flex-direction:column;justify-content:center;padding:4px 2px}
.slide-ticket{display:flex;flex-direction:column;gap:12px;padding:32px 24px}
.slide-emoji{font-size:4rem;line-height:1}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.steps li{display:flex;gap:14px;align-items:flex-start}
.steps .n{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-weight:800;display:grid;place-items:center}
.intro-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.intro-nav .btn-next{padding:12px 22px}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;padding:0;border-radius:99px;background:var(--line);transition:width .25s,background .25s}
.dot.on{width:24px;background:var(--gold)}
.wheel-box{position:relative;width:min(300px,100%);aspect-ratio:1;max-width:100%;margin:6px auto 0}
.wheel{width:100%;height:100%}
.wheel svg{width:100%;height:100%;display:block}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--fg);z-index:2;filter:drop-shadow(0 2px 2px #0008)}
.wheel-result{min-height:3em}
button:disabled{opacity:.5;cursor:default}
.deal{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--gold);color:var(--gold-ink);border-radius:12px;padding:12px 14px;font-weight:700;font-size:.9rem}
.deal-t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.15rem;background:var(--gold-ink);color:var(--gold);border-radius:8px;padding:4px 8px;flex:none}
.deal.hot .deal-t{background:var(--red);color:#fff}

.proof .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:.8rem}
.proof .ago{margin-left:auto;flex:none;font-weight:400;font-size:.7rem;opacity:.6}
.proof.out{opacity:0;transition:opacity .4s}
@keyframes pin{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.agb b{color:var(--fg)}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{background:none;font-size:2.2rem;color:var(--gold);padding:2px 4px;line-height:1}

.bot{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));height:min(460px,70vh);display:flex;flex-direction:column;background:var(--card);border:2px solid var(--gold);border-radius:16px;overflow:hidden;box-shadow:0 16px 40px #000a}
.bot-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}

.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:.88rem;line-height:1.4}

.bot-quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}

.bot-form input{flex:1;min-width:0;padding:10px}
.bot-form button{padding:10px 14px}
.overlay.sheet-ov{align-items:flex-end;padding:0}
.sheet{width:100%;max-width:520px;background:var(--card);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;padding:12px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;text-align:center;animation:up .3s ease-out}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ms => { if (ms == null) return "–"; const t = Math.max(0, ms) / 1000, m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, "0"); return `${String(m).padStart(2,"0")}:${s}`; };

async function api(route, body){
  const r = await fetch(API + route, body === undefined ? { credentials: "same-origin" } :
    { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

  if (r.status === 401 && route !== "/login") { go("pin"); throw new Error("auth"); }
  if (!r.ok) { const e = new Error(j.error || "Fehler"); e.status = r.status; throw e; }

const WHEEL = [
  { t: "iPhone Duo", c: "#B39656", ink: "#ffffff" },
  { t: "Fast gewonnen", c: "#022D94", ink: "#ffffff" },
  { t: "Cuba Libre Flat", c: "#E30613", ink: "#ffffff" },

  { t: "Tayibat|Mo–Fr", c: "#B39656", ink: "#ffffff" },
  { t: "Lola-VIP", c: "#E30613", ink: "#ffffff" }
];
const WHEEL_SEQ = [1, 3, 6, 1, 6, 3];
const WHEEL_MSG = {
  1: ["Fast gewonnen!", "Du warst sooo nah am iPhone Duo. Beim nächsten Dreh klappt's bestimmt."],
  3: ["Glückwunsch! 🎉", "Deine Mindestlaufzeit verlängert sich um 12 Monate. Gratis!"],
  6: ["Niete.", "Aber hey: Das Glück ist mit den Hartnäckigen. Einfach nochmal drehen!"]
};
let wheelRot = 0, wheelSpins = 0;
function wheelSVG(){
  const n = WHEEL.length, R = 140, cx = 150, cy = 150, seg = 360 / n;
  const pt = (a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  let out = "";
  WHEEL.forEach((w, i) => {
    const a0 = i * seg, a1 = a0 + seg, [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), mid = a0 + seg / 2, [tx, ty] = pt(mid, R * .6);
    out += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${w.c}" stroke="#ffffff" stroke-width="2"/>`;
    const lines = w.t.split("|"), fs = lines.some(l => l.length > 13) ? 10.5 : 12;
    const tsp = lines.map((l, k) => `<tspan x="${tx.toFixed(2)}" dy="${k === 0 ? (-(lines.length - 1) * fs * .55).toFixed(1) : (fs * 1.1).toFixed(1)}">${esc(l)}</tspan>`).join("");
    out += `<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="${w.ink}" font-size="${fs}" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${mid - 90} ${tx.toFixed(2)} ${ty.toFixed(2)})" font-family="Manrope, system-ui, sans-serif">${tsp}</text>`;
  });
  out += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#B39656" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="18" fill="#ffffff" stroke="#B39656" stroke-width="3"/><text x="${cx}" y="${cy + 1}" text-anchor="middle" dominant-baseline="middle" font-size="16">😃</text>`;
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Glücksrad">${out}</svg>`;
}

let audio = null;
function startMusic(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const N = { C:523.25, D:587.33, E:659.25, F:698.46, G:783.99 };
    const tune = "E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4 F1 F1 F1.5 F.5 F1 E1 E1 E.5 E.5 E1 D1 D1 E1 D2 G2".split(" ");
    const beat = .28; let total = 0;
    tune.forEach(n => total += parseFloat(n.slice(1)) * beat);
    const g = ctx.createGain(); g.gain.value = .05; g.connect(ctx.destination);
    const schedule = start => { let tt = start; tune.forEach(n => { const d = parseFloat(n.slice(1)) * beat; const o = ctx.createOscillator(); o.type = "square"; o.frequency.value = N[n[0]]; const e = ctx.createGain(); e.gain.setValueAtTime(1, tt); e.gain.exponentialRampToValueAtTime(.01, tt + d * .9); o.connect(e).connect(g); o.start(tt); o.stop(tt + d); tt += d; }); };
    for (let i = 0; i < 8; i++) schedule(ctx.currentTime + .1 + i * total);
    audio = ctx;
  } catch { audio = null; }
}
function stopMusic(){ try { audio && audio.close(); } catch {} audio = null; }

  "Laut meinen Daten sind Ecki und Henner sehr zufrieden. Willst du nicht sein wie Ecki und Henner?",
  "Kleiner Tipp: Mit dem Jahresabo sparst du 0,12 € im Jahr. Das sind fast zwei Kaugummis!"
];
let botIdx = 0, botStarted = false;
const botMsgs = $("#botmsgs");
function botSay(text, me){
  const m = document.createElement("div"); m.className = "msg " + (me ? "me-m" : "bot-m"); m.textContent = text;
  botMsgs.append(m); botMsgs.scrollTop = botMsgs.scrollHeight;
}
function botAnswer(q){
  botSay(q, true);
  const t = document.createElement("div"); t.className = "msg bot-m typing"; t.textContent = "Smily-Bot tippt …";
  botMsgs.append(t); botMsgs.scrollTop = botMsgs.scrollHeight;
  setTimeout(() => {
    t.remove();
    if (/kundennummer/i.test(q)) botSay("Die steht auf der letzten GoldClub-Karte. Aber mit Level 5 bräuchtest du gar keine Kundennummer! 😉");
    else botSay(BOT_REPLIES[botIdx++ % BOT_REPLIES.length]);
  }, 900 + Math.random() * 700);
}
function openBot(){
  $("#bot").hidden = false; $("#botfab").hidden = true;
  if (!botStarted) {
    botStarted = true;
    botSay("Hi, ich bin Smily-Bot 🤖 Wie kann ich dir heute beim Upgraden helfen?");
    $("#botquick").innerHTML = ["Wie kündige ich?", "Wo finde ich meine Kundennummer?", "Ich will hier raus!"].map(q => `<button type="button">${esc(q)}</button>`).join("");
  }
  $("#botin").focus();
}
$("#botfab").onclick = openBot;
$("#botclose").onclick = () => { $("#bot").hidden = true; $("#botfab").hidden = !ACTIVE_STEPS.includes(S.step); };
$("#botquick").onclick = e => { const b = e.target.closest("button"); if (b) botAnswer(b.textContent); };
$("#botform").onsubmit = e => { e.preventDefault(); const v = $("#botin").value.trim(); if (!v) return; $("#botin").value = ""; botAnswer(v); };

/* ===== Bottom Sheets beim Weiternavigieren ===== */
const wait = ms => new Promise(r => setTimeout(r, ms));
function sheet({ emoji, title, text, primary, secondary, onPrimary }){
  return new Promise(res => {
    overlayRoot.innerHTML = `<div class="overlay sheet-ov" role="dialog" aria-modal="true"><div class="sheet">
      <div class="grab" aria-hidden="true"></div><div class="big-emoji">${emoji}</div><h2>${title}</h2><p class="muted">${text}</p>
      <div id="sbody"></div>
      <button class="btn-gold" id="sp" type="button">${primary}</button>
      <button class="btn-tiny" id="ss" type="button">${secondary}</button></div></div>`;
    $("#sp").focus();
    $("#ss").onclick = () => { overlayRoot.innerHTML = ""; res(false); };
    $("#sp").onclick = async () => {
      $("#sp").disabled = $("#ss").disabled = true;
      if (onPrimary) await onPrimary($("#sbody"));
      overlayRoot.innerHTML = ""; res(true);
    };
  });
}
function fakeProgress(body, label, ms){
  return new Promise(r => {
    body.innerHTML = `<p class="small muted" id="pl">${label}</p><div class="progress"><div id="pp"></div></div>`;
    const t0 = Date.now();
    const iv = setInterval(() => { const k = Math.min(1, (Date.now() - t0) / ms); const el = $("#pp"); if (el) el.style.width = (k * 100) + "%"; if (k >= 1) { clearInterval(iv); r(); } }, 100);
  });
}
/* Dead End: Ladespinner, dann Fehlerseite – raus nur über Zurück */
function deadEnd(label){
  return new Promise(res => {
    const el = document.createElement("div"); el.className = "deadend"; el.id = "deadend";
    el.innerHTML = `<div class="dead-in"><div class="spinner" aria-hidden="true"></div><p class="muted">${label}</p></div>`;
    document.body.append(el);
    try { history.pushState({ dead: 1 }, ""); } catch {}
    let done = false;
    const close = () => { if (done) return; done = true; removeEventListener("popstate", close); el.remove(); res(); };
    addEventListener("popstate", close);
    setTimeout(() => {
      if (done) return;
      el.innerHTML = `<button class="dead-back" id="deadback" type="button" aria-label="Zurück">‹ zurück</button>
        <div class="dead-in"><div class="big-emoji">🙈</div><h1>Huppsala, Mensch!</h1><p>Da ist was schiefgelaufen.</p>
        <p class="small muted">Fehlercode: SMILY-404-UPSELL<br>Bitte versuche es später erneut oder wende dich an den Smily-Bot.</p></div>`;
      $("#deadback").onclick = () => { try { history.back(); } catch {} setTimeout(close, 300); };
    }, 4500);
  });
}
async function sheetApp(){
  for (;;) {
    const yes = await sheet({
      emoji: "📱", title: "Smily Level 4 gibt's jetzt als App!",
      text: "Kündige ab sofort ganz bequem in der App.<br><span class=\"fine\">Kündigung in der App nicht verfügbar.</span>",
      primary: "App installieren", secondary: "Weiter im Browser"
    });
    if (!yes) return;
    await deadEnd("Smily-App wird heruntergeladen …");
  }
}
const sheetPush = () => sheet({
  emoji: "🔔", title: "Push-Mitteilungen aktivieren?",
  text: "Verpasse nie wieder ein Angebot. Wir schicken nur das Nötigste (ca. 40 Mitteilungen pro Tag).",
  primary: "Aktivieren", secondary: "Später",
  onPrimary: async () => { toast("Push aktiviert! Deine erste Mitteilung: „Hast du schon an ein Upgrade gedacht?“"); await wait(600); }
});
const sheetAdvent = () => sheet({
  emoji: "🎄", title: "Warte! Kennst du schon unseren Adventskalender?",
  text: "24 Türchen voller Smily-Vorteile. Nur für Level-4-Kund:innen.",
  primary: "Türchen öffnen", secondary: "Nein, ich will nur kündigen",
  onPrimary: async b => { await fakeProgress(b, "Türchen klemmt … wird geöffnet …", 3500); toast("Hinter Türchen 1: ein weiterer Vorteil. Herzlichen Glückwunsch! 🎁"); }
});
async function sheetSurvey(){
  for (;;) {
    const yes = await sheet({
      emoji: "📝", title: "Hast du 2 Minuten für uns?",
      text: "Hilf uns, die Kündigung noch besser zu machen. Es sind nur 47 kurze Fragen.",
      primary: "Klar, gerne!", secondary: "Nein, Kündigung abschicken"
    });
    if (!yes) return;
    await deadEnd("Fragebogen wird geladen …");
  }
}

/* ===== Finale nach der Kündigung ===== */
let justFinished = false;
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.append(c);
  const x = c.getContext("2d"), d = devicePixelRatio || 1; c.width = innerWidth * d; c.height = innerHeight * d; x.scale(d, d);
  const cols = ["#B39656", "#022D94", "#E30613", "#1b8a4c"];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * 4)], a: Math.random() * 6 }));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(f); else c.remove();
  })(t0);
}
async function ending(){
  await wait(2500);
  if (S.step !== "done") return;
  const box = document.createElement("div"); box.className = "pushes"; document.body.append(box);
  const msgs = [["S", "Smily Level 4", "Wir vermissen dich jetzt schon 😢"], ["S", "Smily Level 4", "Komm zurück: 1 Monat gratis!*"], ["H", "Henner", "Komm zurück, ich geb dir einen Cuba Libre aus 🍹"]];
  for (const [a, t, m] of msgs) {
    if (S.step !== "done") break;
    const el = document.createElement("div"); el.className = "push";
    el.innerHTML = `<span class="av">${esc(a)}</span><div><b>${esc(t)}</b> <span class="ago">· jetzt</span><br>${esc(m)}</div>`;
    box.append(el); await wait(1400);
  }
  await wait(1800);
  if (S.step !== "done") { box.remove(); return; }
  const back = await sheet({
    emoji: "💔", title: "Wir vermissen dich!",
    text: "Reaktiviere Smily Level 4 jetzt und erhalte 1 Monat gratis.*<br><span class=\"fine\">*bei 24 Monaten Mindestlaufzeit, zzgl. Checkito-Pauschale</span>",
    primary: "Jetzt reaktivieren", secondary: "Nein! Ich bin endlich frei!"
  });
  box.remove();
  if (back) { toast("Abo reaktiviert! … Kleiner Scherz. Du bist frei. 🎄"); await wait(1200); }
  const fr = $("#freedom"); if (fr) fr.hidden = false;
  confetti();
}

/* ===== Start: Status vom Server holen ===== */
async function boot(){
  try {
    const r = await api("/me");
    const p = r.player;
    S.offset = r.now - Date.now();
    if (r.queueSeconds) QUEUE_SECONDS = Math.max(25, r.queueSeconds);
    if (!p) return go("ticket");
    Object.assign(S, { name: p.name, lastMs: p.lastMs, bestMs: p.bestMs });
    if (p.status === "aktiv") {
      S.startedAt = p.startedAt; S.endedAt = null;
      let step = local.get();
      const ok = ["dash","wheel","agb","kdnr","reason","queue","sign"];
      if (!ok.includes(step)) step = "dash";
      if (["reason","queue","sign"].includes(step) && !p.kdnrOk) step = "kdnr";
      return go(step);
    }
    if (p.status === "gekündigt") { S.startedAt = p.startedAt; S.endedAt = Date.now(); return go("done"); }
    go("ticket");
  } catch (x) { if (x.message !== "auth") { app.innerHTML = `<section class="card"><p class="err">${esc(x.status ? x.message : "Verbindung fehlgeschlagen. Bitte Seite neu laden.")}</p></section>`; } }
}
render(); boot();
</script>
