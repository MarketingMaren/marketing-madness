<style>
/* Layout: one narrow phone column, sticky timer bar on top, a single card per step; overlays for retention offers. Deliberately single-theme (evergreen + gold "premium" look). */
:root{
  /* Basiswerte; das GoldClub-Theme weiter unten überschreibt sie */
  --bg:#f4f5f7; --bg2:#022D94; --card:#ffffff; --line:#dcdcdc;
  --gold:#B39656; --gold-ink:#ffffff; --fg:#181818; --muted:#5f6368;
  --red:#E30613; --ok:#1b8a4c; --ghost:#eef1f8; --blue:#022D94; --blue-soft:#e8edf8;
  --f-display:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;
  background:radial-gradient(120% 60% at 50% 0%, var(--bg2), var(--bg) 70%) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-in{max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:.85rem;letter-spacing:.02em}
.brand b{color:var(--gold)}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;color:var(--gold)}
.pill{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.pill.on{color:var(--red)} .pill.off{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.ticket{position:relative;border-radius:14px;padding:22px 20px;color:var(--gold-ink);
  background:linear-gradient(135deg,#f6d77a,#e3b23c 45%,#b9831c 80%,#f0c75a);box-shadow:0 10px 40px -12px #e3b23c88;overflow:hidden}
.ticket::after{content:"";position:absolute;inset:8px;border:2px dashed #2b1f0566;border-radius:9px;pointer-events:none}
.ticket h1{color:var(--gold-ink)}
.ticket .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
label{font-weight:700;font-size:.9rem}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 16px;font-weight:700}
.btn-gold{background:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-size:1rem}
.btn-red{background:var(--red);color:#fff;font-family:var(--f-display);font-size:1.05rem;padding:18px}
.btn-ghost{background:var(--ghost);color:var(--fg);border:1px solid var(--line)}
.btn-tiny{background:none;color:var(--muted);padding:6px;font-weight:400;font-size:.72rem;text-decoration:underline}
.err{color:#ff9aa1;font-weight:700;font-size:.9rem;min-height:1.2em}
.benefits{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.benefits li{display:flex;gap:10px;align-items:flex-start}
.benefits li::before{content:"★";color:var(--gold);flex:none}
.fine{font-size:.68rem;line-height:1.4;color:#6f8f87}
footer.legal{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.62rem;color:#4f736b;padding-top:20px;border-top:1px solid var(--ghost)}
footer.legal a{color:inherit;text-decoration:none}
footer.legal a.cancel{color:#24504a}
.overlay{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{max-width:400px;width:100%;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.big-emoji{font-size:3rem;line-height:1}
.captcha{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.captcha button{aspect-ratio:1;font-size:2rem;background:var(--bg);border:2px solid var(--line);padding:0}
.captcha button[aria-pressed=true]{border-color:var(--gold);background:#3a3410}
.captcha button.txt{aspect-ratio:auto;min-height:84px;font-size:.78rem;font-weight:700;line-height:1.25;padding:8px 6px;color:var(--fg);hyphens:auto;overflow-wrap:anywhere}
.captcha button.ph{position:relative;overflow:hidden;background:var(--bg)}
.captcha button.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .15s}
.captcha button.ph[aria-pressed=true] img{transform:scale(.86);border-radius:6px}
.captcha button.ph[aria-pressed=true]::after{content:"✓";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-size:.8rem;font-weight:800;display:grid;place-items:center}
.queue-num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:3.4rem;font-weight:700;color:var(--gold);text-align:center;line-height:1}
.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--gold);width:0;transition:width .3s}
canvas.sig{width:100%;height:160px;background:#f2efe4;border-radius:10px;touch-action:none;display:block}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.board li.me{color:var(--gold);font-weight:700}
.board .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.board .r{font-family:var(--f-mono);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.stamp{font-family:var(--f-display);font-weight:800;color:var(--ok);border:3px solid var(--ok);border-radius:10px;padding:8px 12px;transform:rotate(-4deg);align-self:center;text-transform:uppercase;letter-spacing:.06em}
.mission{background:var(--bg);border:2px solid var(--gold);border-radius:14px;padding:18px 18px;display:flex;flex-direction:column;gap:10px}
.mission .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mission ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.mission ol li::marker{color:var(--gold);font-weight:700}
.mission-strip{display:flex;gap:10px;align-items:center;background:#3a1d22;border:1px solid var(--red);border-radius:12px;padding:10px 14px;font-weight:700;font-size:.9rem}
.intro{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.intro::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;min-height:min(540px,calc(100dvh - 190px));display:flex;flex-direction:column;justify-content:center;padding:4px 2px}
.slide-ticket{display:flex;flex-direction:column;gap:12px;padding:32px 24px}
.slide-emoji{font-size:4rem;line-height:1}
.slide-h{font-size:1.9rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.steps li{display:flex;gap:14px;align-items:flex-start}
.steps .n{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-weight:800;display:grid;place-items:center}
.intro-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.intro-nav .btn-next{padding:12px 22px}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;padding:0;border-radius:99px;background:var(--line);transition:width .25s,background .25s}
.dot.on{width:24px;background:var(--gold)}
.wheel-box{position:relative;width:min(300px,100%);aspect-ratio:1;max-width:100%;margin:6px auto 0}
.wheel{width:100%;height:100%}
.wheel svg{width:100%;height:100%;display:block}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--fg);z-index:2;filter:drop-shadow(0 2px 2px #0008)}
.wheel-result{min-height:3em}
button:disabled{opacity:.5;cursor:default}
.deal{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--gold);color:var(--gold-ink);border-radius:12px;padding:12px 14px;font-weight:700;font-size:.9rem}
.deal-t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.15rem;background:var(--gold-ink);color:var(--gold);border-radius:8px;padding:4px 8px;flex:none}
.deal.hot .deal-t{background:var(--red);color:#fff}
.proof{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));display:flex;gap:10px;align-items:center;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:.85rem;font-weight:700;box-shadow:0 8px 24px #0008;animation:pin .35s ease-out}
.proof .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:.8rem}
.proof .ago{margin-left:auto;flex:none;font-weight:400;font-size:.7rem;opacity:.6}
.proof.out{opacity:0;transition:opacity .4s}
@keyframes pin{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.agb{height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.78rem;line-height:1.5;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.agb b{color:var(--fg)}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{background:none;font-size:2.2rem;color:var(--gold);padding:2px 4px;line-height:1}
.bot-fab{position:fixed;z-index:12;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;padding:0;font-size:1.6rem;background:var(--gold);color:var(--gold-ink);box-shadow:0 8px 24px #0009}
.bot{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));height:min(460px,70vh);display:flex;flex-direction:column;background:var(--card);border:2px solid var(--gold);border-radius:16px;overflow:hidden;box-shadow:0 16px 40px #000a}
.bot-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.bot-head b{font-family:var(--f-display);font-size:.9rem}
.bot-head .on{font-size:.72rem;color:var(--ok)}
.bot-head button{margin-left:auto;background:none;color:var(--fg);padding:4px 8px;font-size:1.2rem}
.bot-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:.88rem;line-height:1.4}
.msg.bot-m{background:var(--bg);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me-m{background:var(--gold);color:var(--gold-ink);align-self:flex-end;border-bottom-right-radius:4px;font-weight:700}
.msg.typing{color:var(--muted);font-style:italic}
.bot-quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.bot-quick button{background:var(--ghost);color:var(--fg);border:1px solid var(--line);padding:6px 10px;font-size:.78rem;font-weight:500;border-radius:99px}
.bot-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.bot-form input{flex:1;min-width:0;padding:10px}
.bot-form button{padding:10px 14px}
.overlay.sheet-ov{align-items:flex-end;padding:0}
.sheet{width:100%;max-width:520px;background:var(--card);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;padding:12px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;text-align:center;animation:up .3s ease-out}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.pushes{position:fixed;z-index:16;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.push{display:flex;gap:10px;align-items:flex-start;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;font-size:.85rem;box-shadow:0 8px 24px #0008;animation:pdown .35s ease-out}
.push .av{flex:none;width:30px;height:30px;border-radius:8px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:.8rem}
.push .ago{font-size:.7rem;opacity:.6}
@keyframes pdown{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.freedom{background:var(--ok);color:#06231a;border-radius:14px;padding:16px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.deadend{position:fixed;inset:0;z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 70px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.dead-in{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.spinner{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--gold);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dead-back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 60px);left:max(10px,env(safe-area-inset-left,0px));background:none;color:#4f736b;font-size:.75rem;font-weight:500;padding:6px}
/* ===== GoldClub-Theme (überschreibt die Basis oben): Navy + Gold wie die Sperrseite ===== */
:root{
  --navy:#0b1a33; --navy2:#05101f; --bg:#f7f2e7; --card:#fffdf8; --line:#e6dcc4; --fg:#1d1a14; --muted:#6c6352;
  --gold:#c99a3c; --gold-hi:#f3d68a; --gold-lo:#9c7128; --gold-ink:#1d1406; --ghost:#f3ecdc;
  --red:#b3261e; --ok:#1d7a47; --blue:#0b1a33;
  --f-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --gold-grad:linear-gradient(180deg,#fff1bf,#e8c060 55%,#b8862f);
}
html,body{background:var(--navy2)}
body{background:radial-gradient(70% 40% at 50% 0%,rgba(232,192,96,.18),transparent 70%),linear-gradient(180deg,var(--navy),var(--navy2) 75%) fixed;color:var(--fg)}
body::before{background:var(--navy)}
h1,h2{font-family:var(--f-display);font-weight:800;letter-spacing:0}
.bar{background:rgba(5,16,31,.88);border-bottom:1px solid rgba(232,192,96,.25);backdrop-filter:blur(8px);color:#f4efe6}
.brand{font-family:var(--f-display);font-weight:900;font-size:1.05rem;color:#f4efe6;user-select:none;-webkit-user-select:none;cursor:default}
.brand b{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.timer{color:var(--gold-hi);background:rgba(232,192,96,.12);border:1px solid rgba(232,192,96,.35);border-radius:99px;padding:3px 10px;font-weight:700}
.pill{background:transparent;border:1px solid currentColor}
.pill.on{color:#ff9b8f} .pill.off{color:#7fd8a5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.ticket,.slide-ticket{color:var(--gold-ink);background:linear-gradient(135deg,#f6dc8e,#d9ad4f 45%,#a87a2a 85%,#e9c66f);box-shadow:0 14px 40px -14px rgba(232,192,96,.55);border-radius:14px}
.ticket::after{border-color:rgba(29,20,6,.35)}
.ticket h1{color:var(--gold-ink)}
input[type=text],input[type=password],select,textarea{background:#fff;border:1px solid #b9ad92;border-radius:10px;color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold)}
button{border-radius:50px}
.btn-gold{background:linear-gradient(180deg,#f3d68a,#d4a94a 55%,#a87a2a);color:var(--gold-ink);font-family:var(--f-body);font-size:1.05rem;font-weight:700;box-shadow:0 6px 18px -6px rgba(201,154,60,.7)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-red{background:var(--red);font-weight:700;border-radius:50px}
.btn-ghost{background:#fff;color:var(--fg);border:1px solid var(--gold-lo);font-weight:600}
.btn-tiny{color:var(--muted);border-radius:6px}
.err{color:var(--red)}
.fine{color:#8b826f}
footer.legal{color:#6a7486;border-top-color:rgba(232,192,96,.15)}
footer.legal a.cancel{color:#2a3850}
.modal{background:var(--card);border:1px solid var(--gold);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.captcha button{background:#fff;border:1px solid #b9ad92;border-radius:10px}
.captcha button[aria-pressed=true]{border:2px solid var(--gold);background:#fbf1d8}
.queue-num{color:var(--gold-lo);font-family:var(--f-display)}
.progress{background:var(--ghost)}
canvas.sig{background:#fff;border:1px dashed #b9ad92}
.board li.me{color:var(--gold-lo)}
.toast{background:#05101f;color:#f4efe6;border:1px solid rgba(232,192,96,.4);border-radius:10px}
.mission{background:var(--card);border:0;border-left:3px solid var(--gold);border-radius:4px 14px 14px 4px;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.mission .eyebrow{color:var(--gold-lo);font-weight:700;letter-spacing:.1em}
.mission-strip{background:rgba(179,38,30,.14);border:1px solid rgba(255,155,143,.45);color:#ffd2cc;border-radius:12px}
.steps .n{background:var(--gold-grad);color:var(--gold-ink)}
.dot{background:rgba(244,239,230,.25)}
.dot.on{background:var(--gold)}
.intro-nav .btn-tiny{color:#aab3c2}
.deal{background:var(--card);color:var(--fg);border:2px solid var(--gold);border-radius:12px}
.deal-t{background:var(--gold);color:var(--gold-ink)}
.deal.hot .deal-t{background:var(--red);color:#fff}
.proof,.push{background:var(--card);color:var(--fg);border-left:3px solid var(--gold);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.proof .av,.push .av{background:var(--navy);color:var(--gold-hi)}
.proof.live{border-left-color:var(--ok)}
.proof.live .av{background:var(--ok);color:#fff}
.agb{background:#fbf8f1;border-color:var(--line)}
.stars button{color:var(--gold)}
.bot-fab{background:linear-gradient(180deg,#f3d68a,#c99a3c);color:var(--gold-ink);box-shadow:0 6px 20px rgba(0,0,0,.5)}
.bot{border:1px solid var(--gold);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.bot-head{background:var(--navy);color:#f4efe6;border-bottom:0}
.bot-head b{font-family:var(--f-display)}
.bot-head .on{color:#9fe0bb}
.bot-head button{color:#f4efe6}
.msg.bot-m{background:var(--ghost);color:var(--fg)}
.msg.me-m{background:var(--gold);color:var(--gold-ink)}
.msg.tip{background:#fff4d1;border:1px solid var(--gold)}
.bot-quick button{background:#fff;color:var(--fg);border:1px solid var(--gold-lo)}
.sheet{background:var(--card);border-top:2px solid var(--gold);border-radius:18px 18px 0 0}
.grab{background:#d6cbb0}
.freedom{background:var(--ok);color:#fff;border-radius:12px}
.deadend{background:var(--bg);overflow-y:auto;align-items:flex-start}
.deadend .dead-in{margin:auto}
.spinner{border-color:var(--line);border-top-color:var(--gold)}
.dead-back{color:#8b826f}
.stamp{color:var(--ok);border-color:var(--ok)}
.wheel-pointer{border-top-color:var(--navy)}
.on-dark{color:#f4efe6}
.on-dark .muted,.muted-dark{color:#aab3c2}

/* Preise */
.prizes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prizes li{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.prizes .m{flex:none;font-size:1.7rem;line-height:1}
.prizes b{font-family:var(--f-display);font-size:1.05rem}
.endnote{display:flex;gap:10px;align-items:flex-start;background:var(--navy);color:#f4efe6;border-radius:12px;padding:12px 14px;font-size:.9rem}
.endnote b{color:var(--gold-hi)}

/* Sperrseite (wie „Das goldene Zeitalter des GoldClubs“) */
body.locked .bar{display:none}
body.locked #app{padding-top:0!important}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:34px 0 10px;color:#f4efe6}
.lock .eyebrow{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:#e8c060;font-weight:600}
.gold-h{font-family:var(--f-display);font-weight:900;font-size:clamp(2.3rem,11vw,3.4rem);line-height:1.02;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.lock .lead{color:#c9cfdb;max-width:30ch;font-size:.95rem}
.door{width:min(250px,70vw);margin:12px auto 0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.door svg{display:block;width:100%;height:auto}
.door .medal{cursor:pointer}
.cd-label{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#aab3c2;margin-top:8px}
.cd{display:flex;gap:8px;justify-content:center}
.cd div{width:64px;padding:10px 0 8px;border:1px solid rgba(232,192,96,.25);border-radius:8px;background:rgba(255,255,255,.03)}
.cd b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1;color:#fff;font-variant-numeric:lining-nums tabular-nums}
.cd span{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#aab3c2}
.lock .when b{color:#e8c060}
.plaque{background:linear-gradient(135deg,#f6dc8e,#d9ad4f 50%,#b8862f);color:var(--gold-ink);border-radius:4px;padding:12px 22px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:300px}
.plaque b{font-family:var(--f-display);font-size:1.05rem}
.plaque i{display:block;font-size:.78rem;margin-top:4px}
.lock .foot{font-size:.68rem;color:#6a7486;margin-top:10px}
.simbadge{position:fixed;z-index:50;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#b3261e;color:#fff;font-size:.68rem;font-weight:700;border-radius:99px;padding:4px 10px;letter-spacing:.04em}

/* Admin-Menü + Monitoring */
.admin .modal{text-align:left}
.admin .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.admin button{padding:10px 12px;font-size:.85rem}
.admin h3{margin:6px 0 0;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
body.mon .wrap{max-width:1100px}
body.mon .bar-in{max-width:1100px}
.mon-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mon-kpis div{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.mon-kpis b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1}
.mon-kpis span{font-size:.75rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{text-align:left;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px}
.tbl td{border-bottom:1px solid var(--ghost);padding:7px 8px;vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.tag{display:inline-block;font-size:.65rem;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--ghost)}
.tag.ok{background:#dff3e7;color:var(--ok)} .tag.act{background:#fdecd2;color:#8a5a00} .tag.test{background:#fde3e1;color:var(--red)}
.funnel{display:flex;flex-direction:column;gap:5px}
.funnel div{display:grid;grid-template-columns:minmax(120px,190px) 1fr 3em;gap:8px;align-items:center;font-size:.8rem}
.funnel i{display:block;height:12px;border-radius:99px;background:var(--gold);min-width:2px}
.funnel span:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* Hässliche Hunde auf der Fehlerseite */
.dogpic{width:min(240px,70vw);border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.dogpic img,.dogpic svg{display:block;width:100%;height:auto}
.dogcap{font-size:.85rem;color:var(--muted);max-width:32ch}

/* Flüchtender Premium-Skip */
.skipzone{position:relative;min-height:56px}
.skipzone .btn-gold{transition:transform .25s ease,opacity .3s}
.skipzone .btn-gold.flee{position:absolute;width:auto;left:0;top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.wobble{animation:wob .4s 2}

</head>
<body>

<header class="bar"><div class="bar-in">
  <span class="brand" id="brand">GoldClub <b>Level 4</b></span>
  <span class="pill on" id="abo-pill" hidden>Abo aktiv</span>
  <span class="timer" id="timer">00:00.0</span>
</div></header>

<main class="wrap" id="app" style="padding-top:18px"></main>
<div id="overlay-root"></div>
<button class="bot-fab" id="botfab" type="button" aria-label="GoldClub-Bot öffnen" hidden>💬</button>
<section class="bot" id="bot" aria-label="GoldClub-Bot Chat" hidden>
  <div class="bot-head"><span aria-hidden="true">🤖</span><div><b>GoldClub-Bot</b><br><span class="on">● online · antwortet sofort</span></div><button type="button" id="botclose" aria-label="Chat schließen">✕</button></div>
  <div class="bot-msgs" id="botmsgs" aria-live="polite"></div>
  <div class="bot-quick" id="botquick"></div>
  <form class="bot-form" id="botform"><input type="text" id="botin" placeholder="Deine Frage …" autocomplete="off" maxlength="120"><button class="btn-gold" type="submit">Senden</button></form>
</section>

<script>
let QUEUE_SECONDS = 60;
const SKIP_PENALTY = 10;
const BOT_TIP_AFTER = 120000;   // Chatbot-Tipp auf dem Dashboard nach spätestens 2 Minuten
const PRIZES = [
  { m: "🥇", p: "1. Platz", t: "100 € Gutschein" },
  { m: "🥈", p: "2. Platz", t: "Süße GoldClub-Karte" },
  { m: "🥉", p: "3. Platz", t: "Goldenes Schreibtisch-Upgrade" }
];
const IS_MONITOR = /\/monitor\/?$/.test(location.pathname);
const BASEPATH = location.pathname.replace(/\/+$/, "").replace(/\/monitor$/, "");
const API = BASEPATH + "/api";
let PHASE = { phase: "live", sim: null, start: 0, end: 0, offset: 0 };

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app"), overlayRoot = $("#overlay-root");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ms => { if (ms == null) return "–"; const t = Math.max(0, ms) / 1000, m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, "0"); return `${String(m).padStart(2,"0")}:${s}`; };

async function api(route, body){
  const r = await fetch(API + route, body === undefined ? { credentials: "same-origin" } :
    { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && route !== "/login") { go("pin"); throw new Error("auth"); }
  if (r.status === 423 && j.phase) { applyPhase({ ...PHASE, phase: j.phase }); throw new Error("phase"); }
  if (!r.ok) { const e = new Error(j.error || "Fehler"); e.status = r.status; throw e; }
  return j;
}
/* Tracking fürs Monitoring (fire and forget) */
function track(ev){ if (!S.startedAt || S.endedAt) return; try { fetch(API + "/step", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ev }) }).catch(() => {}); } catch {} }

/* ===== Zustand ===== */
const local = {
  get(){ try { return localStorage.getItem("sl4-step"); } catch { return null; } },
  set(v){ try { localStorage.setItem("sl4-step", v); } catch {} }
};
let S = { step: "loading", name: "", startedAt: null, endedAt: null, offset: 0, lastMs: null, bestMs: null };

/* ===== Timer ===== */
const timerEl = $("#timer"), pill = $("#abo-pill");
(function tick(){
  timerEl.textContent = S.startedAt ? fmt(S.endedAt ? S.lastMs : (Date.now() + S.offset) - S.startedAt) : "00:00.0";
  requestAnimationFrame(tick);
})();

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
const NO_RESUME = ["loading","pin","lock","ended","monitor"];
function go(step){
  S.step = step; if (!NO_RESUME.includes(step)) local.set(step);
  if (["dash","wheel","agb","reason","queue","sign"].includes(step)) track(step);
  render(); window.scrollTo(0, 0);
}
function shake(el){ el.classList.remove("wobble"); void el.offsetWidth; el.classList.add("wobble"); }

const views = {};
views.loading = () => { app.innerHTML = `<section class="card"><p class="muted">GoldClub Level 4 wird geladen …</p></section>`; };

views.pin = () => {
  const N = 5;
  app.innerHTML = `
  <div class="intro" id="intro" aria-roledescription="Karussell">
    <section class="slide" aria-label="1 von ${N}">
      <div class="ticket slide-ticket">
        <div class="slide-emoji" aria-hidden="true">💳</div>
        <h1 class="slide-h">Willkommen in der Abo-Falle.</h1>
        <p>Du hast den Code gescannt. Herzlichen Glückwunsch! Oder auch nicht.</p>
      </div>
    </section>
    <section class="slide" aria-label="2 von ${N}">
      <div class="mission">
        <p class="eyebrow">Deine Mission</p>
        <h1 class="slide-h">Befreie dich aus der Abo-Falle des Marketing-Teams!</h1>
        <p>Das Marketing-Team hat sich ein „unwiderstehliches" Premium-Abo ausgedacht: <b>GoldClub Level 4</b>. Du schließt es gleich ab, ob du willst oder nicht.</p>
        <p><b>Deine Aufgabe: Kündige es so schnell wie möglich.</b></p>
      </div>
    </section>
    <section class="slide" aria-label="3 von ${N}">
      <div class="mission">
        <p class="eyebrow">Die schnellste Flucht wird belohnt</p>
        <h1 class="slide-h">Das gibt's zu gewinnen</h1>
        <ul class="prizes">${PRIZES.map(x => `<li><span class="m" aria-hidden="true">${x.m}</span><div><span class="small muted">${esc(x.p)}</span><br><b>${esc(x.t)}</b></div></li>`).join("")}</ul>
        <div class="endnote"><span aria-hidden="true">🕛</span><div>Das Spiel endet um <b>24 Uhr</b>. Danach geht nichts mehr: Wer den Link dann öffnet, landet direkt bei der finalen Rangliste.</div></div>
      </div>
    </section>
    <section class="slide" aria-label="4 von ${N}">
      <div class="mission">
        <p class="eyebrow">So läuft's</p>
        <ol class="steps">
          <li><span class="n">1</span><div><b>PIN eingeben</b><br><span class="muted">Sie steht auf der letzten GoldClub-Karte. Noch läuft keine Uhr.</span></div></li>
          <li><span class="n">2</span><div><b>Name eingeben</b><br><span class="muted">Damit ist das Abo abgeschlossen und die Uhr läuft.</span></div></li>
          <li><span class="n">3</span><div><b>Kündigung durchboxen</b><br><span class="muted">Das Marketing-Team wird alles versuchen, dich zu halten.</span></div></li>
          <li><span class="n">4</span><div><b>Schneller sein als alle anderen</b><br><span class="muted">Die drei schnellsten Kündigungen bis 24 Uhr gewinnen.</span></div></li>
        </ol>
      </div>
    </section>
    <section class="slide" aria-label="5 von ${N}">
      <form class="card" id="f">
        <p class="eyebrow" style="color:var(--gold-lo);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700">Bereit?</p>
        <h2>Gleich startet die Uhr.</h2>
        <p>Zuerst brauchst du die <b>PIN von der GoldClub-Karte</b>. Danach gibst du deinen Namen ein, und <b>ab dann läuft die Zeit</b>. Also: tief durchatmen.</p>
        <div class="field"><label for="pin">PIN (steht auf der GoldClub-Karte)</label><input type="text" id="pin" inputmode="numeric" autocomplete="off" maxlength="12"></div>
        <p class="err" id="err"></p>
        <button class="btn-gold" type="submit">PIN bestätigen</button>
      </form>
    </section>
  </div>
  <div class="intro-nav">
    <button class="btn-tiny" id="skipIntro" type="button">Überspringen</button>
    <div class="dots" id="dots">${Array.from({ length: N }, (_, i) => `<button type="button" class="dot" data-i="${i}" aria-label="Seite ${i + 1}"></button>`).join("")}</div>
    <button class="btn-gold btn-next" id="next" type="button">Weiter</button>
  </div>`;
  const intro = $("#intro"), slides = [...intro.children], dots = [...$("#dots").children];
  let idx = 0;
  const show = i => { intro.scrollTo({ left: slides[i].offsetLeft - intro.offsetLeft, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); };
  const update = () => {
    idx = Math.round(intro.scrollLeft / intro.clientWidth);
    dots.forEach((d, i) => d.classList.toggle("on", i === idx));
    const last = idx === slides.length - 1;
    $("#next").style.visibility = last ? "hidden" : "visible";
    $("#skipIntro").style.visibility = last ? "hidden" : "visible";
  };
  intro.addEventListener("scroll", () => requestAnimationFrame(update), { passive: true });
  $("#next").onclick = () => show(Math.min(idx + 1, slides.length - 1));
  $("#skipIntro").onclick = () => show(slides.length - 1);
  dots.forEach(d => d.onclick = () => show(+d.dataset.i));
  update();
  $("#f").onsubmit = async e => {
    e.preventDefault();
    try { await api("/login", { pin: $("#pin").value.trim() }); await boot(); }
    catch (x) { if (x.message === "phase") return; $("#err").textContent = x.message === "auth" ? "" : x.message; shake($("#f")); }
  };
};

views.ticket = () => {
  app.innerHTML = `
  <div class="mission-strip" role="note">⏱ Mit Klick auf „Jetzt gratis testen" startet die Uhr. Dann heißt es: Kündigung durchbekommen!</div>
  <section class="ticket">
    <h1>Glückwunsch! Du wurdest ausgewählt.</h1>
    <p style="margin-top:10px">Teste <b>GoldClub Level 4</b> jetzt kostenlos und sichere dir exklusive Vorteile für den ganzen Abend.</p>
  </section>
  <form class="card" id="f">
    <div class="field">
      <label for="name">Dein Name</label>
      <input type="text" id="name" maxlength="30" autocomplete="nickname" placeholder="Vorname oder Spitzname" value="${esc(S.name)}">
    </div>
    <p class="err" id="err"></p>
    <button class="btn-gold" type="submit">Jetzt gratis testen</button>
    <p class="fine">Mit Klick auf „Jetzt gratis testen" schließt du ein Abonnement „GoldClub Level 4" zu 49,99 € pro Monat (zzgl. 4,99 € Checkito-Pauschale) mit einer Mindestlaufzeit von 24 Monaten ab. Die Testphase endet sofort. Die Kündigung ist jederzeit möglich, sofern sie gelingt. Die Zeit bis zur erfolgreichen Kündigung wird gemessen und in einer Rangliste veröffentlicht. Gespeichert werden nur dein Name, deine Zeit und welche Stationen du erreicht hast. Nach der Feier wird alles gelöscht.</p>
  </form>`;
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const n = $("#name").value.trim();
    if (n.length < 2) { $("#err").textContent = "Bitte gib deinen Namen ein, damit wir dir die Rechnung zuordnen können."; return; }
    try {
      const r = await api("/start", { name: n });
      Object.assign(S, { name: n, startedAt: r.startedAt, offset: r.now - Date.now(), endedAt: null, lastMs: null });
      resetRun();
      go("dash");
    } catch (x) { if (x.message !== "auth" && x.message !== "phase") $("#err").textContent = x.message; }
  };
};

const BENEFITS = [
  "Priorisierter Zugang zum Buffet (direkt nach der Geschäftsführung)",
  "Cuba Libre Flat (all night long)",
  "Neuer Filter für die Hotelsuche: „Privatjet-Parkplatz vorhanden“",
  "Zugang zu 0 neuen Features pro Quartal",
  "Kostenloser Zugang zu allen Vorteilen von GoldClub Level 1, 2 und 3",
  "Stammplatz im neuen FIFA Dome",
  "„Fast Lane“ bei Merlin (im Fall von IT-Problemen)",
  "Lola-Zugang unter 23"
];
views.dash = () => {
  let shown = 3;
  app.innerHTML = `
  <div class="mission-strip" role="note">⏱ Die Uhr läuft! Mission: Kündige dieses Abo. Irgendwo hier muss es doch gehen …</div>
  <div class="deal" id="dealbox"><span>🔥 Nur jetzt: <b>−0,01 €</b> auf deinen nächsten Monat. Angebot endet in</span><span class="deal-t" id="deal">00:59</span></div>
  <section class="card">
    <p class="small muted">Willkommen im Premium-Club,</p>
    <h1>${esc(S.name)} 🎉</h1>
    <p>Dein Abo ist aktiv. Das sind deine Vorteile:</p>
    <ul class="benefits" id="ben"></ul>
    <button class="btn-gold" id="more">Weitere Vorteile entdecken</button>
    <div class="row">
      <button class="btn-ghost" id="up">Auf Level 5 upgraden</button>
      <button class="btn-ghost" id="help">Hilfe</button>
    </div>
  </section>
  <section class="card">
    <h2>Deine Ersparnis heute</h2>
    <p class="muted">Du hast mit GoldClub Level 4 bereits <b style="color:var(--gold)">0,00 €</b> gespart. Weiter so!</p>
  </section>
  <footer class="legal">
    <a href="#" data-x="imp">Impressum</a><a href="#" data-x="ds">Datenschutz</a><a href="#" data-x="agb">AGB</a>
    <a href="#" data-x="ck">Cookie-Einstellungen</a><a href="#" data-x="kd" class="cancel">Vertrag hier kündigen</a><a href="#" data-x="pr">Presse</a>
    <span>© GoldClub Premium Services · Weihnachtsfeier-Parodie</span>
  </footer>`;
  const ben = $("#ben");
  const draw = () => ben.innerHTML = BENEFITS.slice(0, shown).map(b => `<li>${esc(b)}</li>`).join("");
  draw();
  $("#more").onclick = () => { shown = Math.min(BENEFITS.length, shown + 1); draw(); if (shown === BENEFITS.length) toast("Du kennst jetzt alle Vorteile. Glückwunsch!"); };
  $("#up").onclick = () => toast("Level 5 ist leider nur für Level-5-Kunden verfügbar.");
  $("#help").onclick = () => openBot();
  let dealT = 59;
  const dealIv = setInterval(() => {
    const el = $("#deal"); if (S.step !== "dash" || !el) return clearInterval(dealIv);
    dealT--;
    if (dealT < 0) { dealT = 59; toast("Gute Nachricht: Wir haben das Angebot verlängert. Nur für dich!"); }
    el.textContent = `00:${String(dealT).padStart(2, "0")}`;
    $("#dealbox").classList.toggle("hot", dealT < 10);
  }, 1000);
  scheduleBotTip();
  app.querySelectorAll("footer a").forEach(a => a.onclick = e => {
    e.preventDefault();
    const x = a.dataset.x;
    if (x === "kd") return retention();
    const msgs = { imp: "Impressum wird geladen … (voraussichtlich 2027)", ds: "Deine Daten sind bei uns sicher. Und bei 412 Partnern.", agb: "Die AGB umfassen 96 Seiten. Viel Spaß!", ck: "Alle Cookies wurden zu deinem Vorteil akzeptiert.", pr: "Keine Presse, bitte." };
    toast(msgs[x]);
  });
};

function modal(html, buttons){
  return new Promise(res => {
    overlayRoot.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="modal">${html}<div class="btns" style="display:flex;flex-direction:column;gap:8px"></div></div></div>`;
    const box = $(".btns", overlayRoot);
    buttons.forEach((b, i) => { const el = document.createElement("button"); el.className = b.cls; el.textContent = b.label; el.onclick = () => { overlayRoot.innerHTML = ""; res(i); }; box.append(el); });
    box.querySelector("button")?.focus();
  });
}

async function retention(){
  track("retention1");
  let r = await modal(`<div class="big-emoji">🎁</div><h2>Warte! Exklusiv für dich:</h2><p>Bleib bei GoldClub Level 4 und zahle die nächsten 3 Monate nur <b>49,98 €</b> statt 49,99 €.</p>`,

function wheelSVG(){

    const lines = w.t.split("|"), fs = lines.length > 2 ? 9.5 : lines.some(l => l.length > 13) ? 10.5 : 12;

let audio = null;
function startMusic(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const N = { C:523.25, D:587.33, E:659.25, F:698.46, G:783.99 };
    const tune = "E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4 F1 F1 F1.5 F.5 F1 E1 E1 E.5 E.5 E1 D1 D1 E1 D2 G2".split(" ");
    const beat = .28; let total = 0;
    tune.forEach(n => total += parseFloat(n.slice(1)) * beat);
    const g = ctx.createGain(); g.gain.value = .05; g.connect(ctx.destination);
    const schedule = start => { let tt = start; tune.forEach(n => { const d = parseFloat(n.slice(1)) * beat; const o = ctx.createOscillator(); o.type = "square"; o.frequency.value = N[n[0]]; const e = ctx.createGain(); e.gain.setValueAtTime(1, tt); e.gain.exponentialRampToValueAtTime(.01, tt + d * .9); o.connect(e).connect(g); o.start(tt); o.stop(tt + d); tt += d; }); };
    for (let i = 0; i < 8; i++) schedule(ctx.currentTime + .1 + i * total);
    audio = ctx;
  } catch { audio = null; }
}
function stopMusic(){ try { audio && audio.close(); } catch {} audio = null; }

}, 500);

function buildAgb(){

    pollFeed(true);
    if (!p) return go("ticket");
    Object.assign(S, { name: p.name, lastMs: p.lastMs, bestMs: p.bestMs });
    if (p.status === "aktiv") {
      S.startedAt = p.startedAt; S.endedAt = null;
      let step = local.get();
      if (!ACTIVE_STEPS.includes(step)) step = "dash";
      if (step === "sign" && !p.queueOk) step = "queue";
      return go(step);
    }
    if (p.status === "gekündigt") { S.startedAt = p.startedAt; S.endedAt = Date.now(); return go("done"); }
    go("ticket");
  } catch (x) { if (!["auth","phase"].includes(x.message)) { app.innerHTML = `<section class="card"><p class="err">${esc(x.status ? x.message : "Verbindung fehlgeschlagen. Bitte Seite neu laden.")}</p></section>`; } }
}
render(); boot();
</script>
</body>
</html>
